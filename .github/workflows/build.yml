name: Build C3350EMU

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Python research tools
        run: python -m unittest discover -s tests -p test_*.py
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/c3350emu.exe dist/
          @"
          C3350EMU
          ========
          This is an early research build. It can inspect basic firmware file
          metadata and header bytes. It does not decode the complete FLS format
          or execute the Samsung GT-C3350 firmware yet.
          "@ | Set-Content dist/README.txt
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: C3350EMU-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Python research tools
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: C3350EMU-linux-x64
          path: build/c3350emu
          if-no-files-found: error
          retention-days: 30
